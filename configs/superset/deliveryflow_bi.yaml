# DeliveryFlow Superset BI-as-Code Configuration
# Declarative definition of ClickHouse database connection, datasets, charts,
# and dashboard layout for automated provisioning via import_superset_assets.py.
version: 1

database:
  name: DeliveryFlow ClickHouse
  connection: clickhouse
  expose_in_sqllab: true

datasets:
  - name: Delivery Status Overview
    schema: delivery
    table_name: v_delivery_status_overview
  - name: Delay by Region
    schema: delivery
    table_name: v_delay_by_region
  - name: Vehicle Utilization
    schema: delivery
    table_name: v_vehicle_utilization
  - name: Warehouse Daily KPI
    schema: delivery
    table_name: v_warehouse_daily_kpi
    main_dttm_col: business_date
    temporal_columns:
      - business_date
  - name: Delivery Event Volume
    schema: delivery
    table_name: v_delivery_event_volume
    main_dttm_col: event_hour
    temporal_columns:
      - event_hour
  - name: Transportation Cost Performance
    schema: delivery
    table_name: v_transportation_cost_performance
    main_dttm_col: business_date
    temporal_columns:
      - business_date

charts:
  - name: Delivery Status Overview
    dataset: Delivery Status Overview
    viz_type: dist_bar
    params:
      metrics:
        - event_count
      groupby:
        - status
      row_limit: 1000
      show_legend: true
  - name: Delay by Region and Service Level
    dataset: Delay by Region
    viz_type: pivot_table_v2
    params:
      metrics:
        - delay_rate
        - avg_delay_minutes
      groupbyRows:
        - region
      groupbyColumns:
        - service_level
      row_limit: 1000
  - name: Vehicle Utilization
    dataset: Vehicle Utilization
    viz_type: table
    params:
      metrics:
        - avg_utilization_ratio
      groupby:
        - vehicle_id
        - active_status
        - route_id
      row_limit: 1000
  - name: Warehouse Daily KPI
    dataset: Warehouse Daily KPI
    viz_type: table
    params:
      metrics:
        - completed_deliveries
        - delayed_deliveries
        - on_time_deliveries
        - delay_rate
        - on_time_rate
        - total_order_value
      groupby:
        - business_date
        - region
        - warehouse_id
      row_limit: 1000
  - name: Hourly Delivery Event Volume
    dataset: Delivery Event Volume
    viz_type: echarts_timeseries_line
    params:
      x_axis: event_hour
      granularity_sqla: event_hour
      time_grain_sqla: PT1H
      temporal_columns_lookup:
        event_hour: true
      metrics:
        - event_count
      groupby:
        - event_type
      row_limit: 1000
  - name: Actual Transportation Cost
    dataset: Transportation Cost Performance
    viz_type: big_number_total
    params:
      metric: actual_cost
      subheader: Actual transportation cost
  - name: Transportation Cost Variance
    dataset: Transportation Cost Performance
    viz_type: big_number_total
    params:
      metric: cost_variance
      subheader: Actual cost minus planned cost
  - name: Transportation Cost per Delivery
    dataset: Transportation Cost Performance
    viz_type: big_number_total
    params:
      metric: cost_per_delivery
      subheader: Actual cost per delivery
  - name: Transportation Cost Breakdown
    dataset: Transportation Cost Performance
    viz_type: dist_bar
    params:
      metrics:
        - fuel_cost
        - driver_cost
        - toll_cost
        - maintenance_cost
        - other_cost
      groupby:
        - business_date
      row_limit: 1000
      show_legend: true
  - name: Route Cost Performance
    dataset: Transportation Cost Performance
    viz_type: table
    params:
      metrics:
        - actual_cost
        - cost_per_delivery
        - cost_variance
      groupby:
        - route_id
        - region
      row_limit: 1000
  - name: Warehouse Region Transportation Cost
    dataset: Transportation Cost Performance
    viz_type: dist_bar
    params:
      metrics:
        - actual_cost
      groupby:
        - warehouse_id
        - region
      row_limit: 1000
      show_legend: true
  - name: Route Cost vs Delay Risk
    dataset: Transportation Cost Performance
    viz_type: table
    params:
      metrics:
        - actual_cost
        - delay_rate
        - avg_delay_minutes
        - cost_delay_risk_score
      groupby:
        - route_id
        - warehouse_id
        - region
      row_limit: 1000

dashboard:
  title: DeliveryFlow Operations Dashboard
  slug: deliveryflow-operations
  published: true
  charts:
    - Delivery Status Overview
    - Delay by Region and Service Level
    - Vehicle Utilization
    - Warehouse Daily KPI
    - Hourly Delivery Event Volume

dashboards:
  - title: Transportation Cost & Route Performance
    slug: transportation-cost-route-performance
    published: true
    filters:
      - name: Business Date
        column: business_date
      - name: Warehouse
        column: warehouse_id
      - name: Region
        column: region
      - name: Route
        column: route_id
    charts:
      - Actual Transportation Cost
      - Transportation Cost Variance
      - Transportation Cost per Delivery
      - Transportation Cost Breakdown
      - Route Cost Performance
      - Warehouse Region Transportation Cost
      - Route Cost vs Delay Risk
